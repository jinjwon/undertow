# Builds the installers on each platform's own runner and attaches them to the tag's release.
# Windows' NSIS installer (with Start menu and desktop shortcuts) can only be built on Windows.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - os: windows-latest
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # The release is created before the tag is pushed, so both jobs only upload.
      - run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.files }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
