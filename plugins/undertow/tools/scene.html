<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Barlow;src:url(fonts/Barlow-BlackItalic.ttf);font-weight:900;font-style:italic}
html,body{margin:0;background:transparent;overflow:hidden}
text{font-family:Barlow;font-weight:900;font-style:italic}
</style></head><body><svg id="s" xmlns="http://www.w3.org/2000/svg" width="840" height="1538"></svg>
<script type="module">
import { ART, COLOR as K, ITEM_ROWS, MENUS } from '../hooks/tokens.js'
const q = new URLSearchParams(location.search), MENU = q.get('menu') || 'SKILL', T = +(q.get('t') || 1)
const svg = document.getElementById('s'), index = MENUS.indexOf(MENU)
svg.setAttribute('viewBox', `0 0 ${ART.width} ${ART.height}`)
const ease = x => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3)
const f = ease(T * 1.25), g = ease((T - 0.2) * 1.5)
const big = (t, x, y, rot, size, fill, extra = '') => `<text transform="translate(${x} ${y}) rotate(${rot})" font-size="${size}" letter-spacing="-4" fill="${fill}" ${extra}>${t}</text>`
const circle = (x, y, r, fill, extra = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" ${extra}/>`

// Each menu's own composition, in the stage's left third: the planes, then its big word. Nothing crosses x=430 but SYSTEM's.
const STAGES = {
  SKILL: { from: [-1, 0], draw: () =>
    `<path d="M0 150H440C540 340 300 560 350 760C372 860 320 980 300 1100H0Z" fill="${K.WHITE}"/>` + big(MENU, 8, 236, 90, 300, K.BLACK) },
  ITEM: { from: [0, 1], draw: () =>
    `<path d="M0 150H410L260 430L0 560Z" fill="${K.OCEAN}"/><path d="M0 470L440 1100H0Z" fill="${K.WHITE}"/>` + big(MENU, 30, 1030, -55, 290, K.BLACK) },
  EQUIP: { from: [-1, 0], draw: () =>
    `<path d="M0 230L410 170L350 410L0 470Z" fill="${K.WHITE}"/><path d="M0 490L340 425L300 650L0 700Z" fill="${K.ICE}"/><path d="M0 720L290 660L250 1100H0Z" fill="${K.WHITE}"/>` + big(MENU, 248, 1040, -90, 250, K.BLACK) },
  AGENT: { from: [-1, 0], draw: () =>
    `<path d="M0 150H400L430 1100H0Z" fill="${K.ABYSS}"/>` + [0, 1, 2, 3, 4, 5].map(i => `<path d="M0 ${300 + i * 130}L420 ${250 + i * 130}V${300 + i * 130}L0 ${350 + i * 130}Z" fill="${i % 2 ? K.OCEAN : K.MIDNIGHT}"/>`).join('') + big(MENU, 90, 236, 90, 280, K.WHITE) },
  STATUS: { from: [0, 1], draw: () =>
    [900, 760, 620, 480].map((r, i) => circle(-40, 1090, r, i % 2 ? K.MIDNIGHT : K.OCEAN, `clip-path="url(#left)"`)).join('') + circle(-40, 1090, 350, K.WHITE) + big(MENU, 40, 1010, -78, 176, K.WHITE, `stroke="${K.BLACK}" stroke-width="10" paint-order="stroke"`) },
  QUEST: { from: [-1, 1], draw: () =>
    `<path d="M0 1100V640L300 160H440L170 1100Z" fill="${K.WHITE}"/><path d="M190 1100L450 190H480L225 1100Z" fill="${K.CYAN}"/>` + big(MENU, 86, 1080, -66, 250, K.BLACK) },
  LINK: { from: [0, -1], draw: () =>
    circle(170, 400, 225, K.WHITE) + circle(170, 780, 270, K.ICE) + `<clipPath id="lens"><circle cx="170" cy="400" r="225"/></clipPath>` + circle(170, 780, 270, K.OCEAN, 'clip-path="url(#lens)"') + big(MENU, 14, 880, -8, 165, K.ABYSS) },
  CALENDAR: { from: [1, 0], draw: () =>
    `<mask id="moon"><rect width="1120" height="2050" fill="#fff"/>${circle(95, 560, 222, '#000')}</mask>` + circle(180, 600, 250, K.WHITE, 'mask="url(#moon)"') + Array.from({ length: 30 }, (_, i) => {
      const a = (i / 30) * Math.PI * 2, r0 = i % 5 ? 268 : 260, r1 = 284
      return `<line x1="${180 + r0 * Math.cos(a)}" y1="${600 + r0 * Math.sin(a)}" x2="${180 + r1 * Math.cos(a)}" y2="${600 + r1 * Math.sin(a)}" stroke="${K.ICE}" stroke-width="5" clip-path="url(#left)"/>`
    }).join('') + big(MENU, 16, 1022, -6, 90, K.WHITE) },
  SYSTEM: { from: [0, -1], draw: () =>
    `<mask id="sea"><rect width="1120" height="2050" fill="#fff"/>${circle(830, 560, 680, '#000')}</mask><path d="M0 150H1120V1100H0Z" fill="${K.WHITE}" mask="url(#sea)"/>` + circle(830, 560, 680, 'none', `stroke="${K.ABYSS}" stroke-width="10"`) + `<g mask="url(#sea)">${big(MENU, -24, 1090, -62, 300, K.BLACK)}</g>` },
}

const stage = STAGES[MENU]
const dx = (1 - f) * 620 * stage.from[0], dy = (1 - f) * 620 * stage.from[1]
const ghostSize = Math.min(560, 2600 / MENU.length)

svg.innerHTML = `<defs>
  <clipPath id="stage"><path d="M0 225L1120 165V960L0 1060Z"/></clipPath>
  <clipPath id="left"><path d="M0 0H430V1200H0Z"/></clipPath>
  <clipPath id="below"><path d="M0 1060L1120 960V1903L0 1955Z"/></clipPath>
</defs>
<g clip-path="url(#below)" opacity="${g}"><g transform="translate(${index % 2 ? -30 : 60} ${index % 2 ? 1780 : 1680}) rotate(-8)"><text font-size="${ghostSize}" letter-spacing="-8" fill="${K.CYAN}" opacity=".12">${MENU}</text></g></g>
<g clip-path="url(#stage)"><g transform="translate(${dx} ${dy})">${stage.draw()}</g>
  <text transform="translate(${index === 8 ? 182 : 1030} ${index === 8 ? 720 : 300}) rotate(-6)" font-size="${index === 8 ? 480 : 150}" text-anchor="${index === 8 ? 'start' : 'end'}" fill="${index === 8 ? K.GRAY : K.ICE}" opacity="${index === 8 ? g : g * 0.12}">${index + 1}</text>
  ${q.get('hero') ? `<image href="../hero.png" x="0" y="225" width="430" height="835" preserveAspectRatio="xMidYMax meet" opacity="${g}"/>` : ''}
  <g id="items"></g>
</g>
<path d="M0 0H1120V165L0 225Z" fill="${K.INK}"/><path d="M0 225L1120 165" stroke="${K.WHITE}" stroke-width="3"/>
<path d="M0 1060L1120 960" stroke="${K.WHITE}" stroke-width="3" opacity="${g}"/>

<g id="cursorline"></g>`

const NS = 'http://www.w3.org/2000/svg'
const ITEM_TONES = [K.CYAN, K.ICE, '#2FC6FA']
await document.fonts.load('italic 900 80px Barlow')
const items = document.getElementById('items')
const measure = (word, size) => {
  const t = document.createElementNS(NS, 'text'); t.setAttribute('font-size', size); t.textContent = word; items.append(t)
  const w = t.getComputedTextLength(); t.remove(); return w
}
let html = '', tip = null
MENUS.forEach((name, i) => {
  const row = ITEM_ROWS[i], on = i === index
  const shove = on ? 0 : (i < index ? -24 : 18) // The neighbours make way for the selected name.
  const a = ease(T * 1.5 - Math.abs(i - index) * 0.07)
  const x = row.x + (1 - a) * 240, y = row.y + shove
  if (!on) {
    html += `<text transform="translate(${x} ${y}) rotate(${row.tilt})" font-size="78" letter-spacing="-1" fill="${ITEM_TONES[i % 3]}" opacity="${a}">${name}</text>`
    return
  }
  const w = measure(name, 92), s = ease(T * 1.4)
  const white = `-58,26 ${w + 22},10 ${w + 62},-104 ${w * 0.08},-58`
  const slash = `${w * 0.16},-72 ${w + 52},-102 ${w + 16},-30 ${w * 0.1},-34`
  html += `<g transform="translate(${x} ${y}) rotate(${row.tilt})">
    <g transform="scale(${s} 1)"><polygon points="${white}" transform="translate(9 10)" fill="${K.PINK}"/><polygon points="${white}" fill="${K.WHITE}"/></g>
    <text font-size="92" letter-spacing="-2" fill="${K.BLACK}">${name}</text>
    <clipPath id="slash"><polygon points="${slash}"/></clipPath>
    <text font-size="92" letter-spacing="-2" fill="${K.RED}" clip-path="url(#slash)">${name}</text>
  </g>`
  // The cursor's tip, on the page: the thread down to the content starts here.
  const r = row.tilt * Math.PI / 180
  tip = [x + (w + 62) * Math.cos(r) + 104 * Math.sin(r), y + (w + 62) * Math.sin(r) - 104 * Math.cos(r)]
})
items.innerHTML = html
const floorAt = x => 1060 - x * (100 / 1120)
if (tip) document.getElementById('cursorline').innerHTML = `<path d="M${tip[0]} ${tip[1]}L1030 ${tip[1] - 8}V${floorAt(1030)}" fill="none" stroke="${K.PINK}" stroke-width="4" opacity="${g}"/>`
</script></body></html>
